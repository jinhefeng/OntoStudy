<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17263f">
  <meta name="description" content="以供热系统为案例的交互式工程本体论学习工坊">
  <title>本体论学习工坊 · 把语义变成工程能力</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="课程导航">
      <a class="brand" href="#top" aria-label="本体论学习工坊首页">
        <span class="brand-mark" aria-hidden="true">
          <span></span><span></span><span></span><i></i><b></b>
        </span>
        <span class="brand-copy"><strong>本体论</strong><small>学习工坊</small></span>
      </a>

      <div class="sidebar-label">学习路径 <span>8 单元</span></div>
      <nav id="lesson-nav" class="lesson-nav"></nav>

      <section class="sidebar-progress" aria-labelledby="sidebar-progress-title">
        <div class="progress-heading">
          <span id="sidebar-progress-title">学习进度</span>
          <strong id="progress-count">0 / 8</strong>
        </div>
        <div class="progress-track"><span id="progress-bar"></span></div>
        <p id="progress-caption">从一个真实问题开始</p>
      </section>

      <div class="sidebar-foot">
        <span class="local-dot" aria-hidden="true"></span>
        <span>进度与批注保存在本机<br>选中文字即可添加批注</span>
      </div>
    </aside>

    <main id="top" class="main-content">
      <header class="topbar">
        <div class="breadcrumb"><span>工程本体论</span><span class="crumb-slash">/</span><strong>供热产品实践路径</strong></div>
        <div class="topbar-actions">
          <span class="version-pill">路线图 v0.1</span>
          <button id="export-comments" class="text-button" type="button" disabled aria-label="导出全部课程批注">导出批注 <span id="comment-count">0</span></button>
          <button id="reset-progress" class="text-button" type="button">重置学习记录</button>
        </div>
      </header>

      <section class="workspace">
        <div id="lesson-container" class="lesson-column" aria-live="polite"></div>
        <aside id="lesson-aside" class="lesson-aside" aria-label="单元信息"></aside>
      </section>

      <footer class="page-footer">
        <span>Ontology Learning Workshop</span>
        <span>从概念到产品，从模型到协作</span>
      </footer>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="annotation-popover" class="annotation-popover" role="dialog" aria-label="课程批注" hidden></div>
</body>
</html>
