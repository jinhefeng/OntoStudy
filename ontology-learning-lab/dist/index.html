<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17263f">
  <meta name="description" content="以供热系统为案例的交互式工程本体论学习工坊">
  <title>本体论学习工坊 · 把语义变成工程能力</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="课程导航">
      <a class="brand" href="#home" aria-label="本体论学习工坊首页">
        <span class="brand-mark" aria-hidden="true">
          <span></span><span></span><span></span><i></i><b></b>
        </span>
        <span class="brand-copy"><strong>本体论</strong><small>学习工坊</small></span>
      </a>

      <div class="sidebar-label">学习路径 <span>8 单元</span></div>
      <nav id="lesson-nav" class="lesson-nav"></nav>

      <section class="sidebar-progress" aria-labelledby="sidebar-progress-title">
        <div class="progress-heading">
          <span id="sidebar-progress-title">学习进度</span>
          <strong id="progress-count">0 / 8</strong>
        </div>
        <div class="progress-track"><span id="progress-bar"></span></div>
        <p id="progress-caption">从一个真实问题开始</p>
      </section>

      <div class="sidebar-foot">
        <span class="local-dot" aria-hidden="true"></span>
        <span>进度与批注保存在本机<br>选中文字即可添加批注</span>
      </div>
    </aside>

    <main id="top" class="main-content">
      <header class="topbar">
        <div class="breadcrumb"><span>工程本体论</span><span class="crumb-slash">/</span><strong id="breadcrumb-current">学习首页</strong></div>
        <div class="topbar-actions">
          <span class="version-pill">路线图 v0.1</span>
          <button id="export-comments" class="text-button" type="button" disabled aria-label="导出全部课程批注">导出批注 <span id="comment-count">0</span></button>
          <button id="reset-progress" class="text-button" type="button">重置学习记录</button>
        </div>
      </header>

      <section class="workspace">
        <div id="lesson-container" class="lesson-column" aria-live="polite"></div>
        <aside id="lesson-aside" class="lesson-aside" aria-label="单元信息"></aside>
      </section>

      <footer class="page-footer">
        <span>Ontology Learning Workshop</span>
        <span>从概念到产品，从模型到协作</span>
        <a class="github-link" href="https://github.com/jinhefeng/OntoStudy" target="_blank" rel="noopener noreferrer" aria-label="在 GitHub 上查看 OntoStudy 开源项目">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 .9C5.87.9.9 5.87.9 12c0 4.9 3.18 9.06 7.59 10.53.55.1.75-.24.75-.53v-2.03c-3.09.67-3.74-1.31-3.74-1.31-.5-1.28-1.23-1.62-1.23-1.62-1.01-.69.08-.68.08-.68 1.12.08 1.71 1.15 1.71 1.15 1 .1 1.74 1.72 2.65 1.23.1-.72.39-1.21.71-1.49-2.47-.28-5.07-1.23-5.07-5.49 0-1.21.43-2.2 1.15-2.98-.11-.28-.5-1.41.11-2.94 0 0 .94-.3 3.08 1.14a10.7 10.7 0 0 1 5.6 0c2.14-1.45 3.08-1.14 3.08-1.14.61 1.53.23 2.66.11 2.94.72.78 1.15 1.77 1.15 2.98 0 4.27-2.6 5.2-5.08 5.48.4.35.75 1.02.75 2.06V22c0 .29.2.64.76.53A11.1 11.1 0 0 0 23.1 12C23.1 5.87 18.13.9 12 .9Z"/></svg>
          <span>github.com/jinhefeng/OntoStudy</span>
        </a>
      </footer>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="annotation-popover" class="annotation-popover" role="dialog" aria-label="课程批注" hidden></div>
</body>
</html>
